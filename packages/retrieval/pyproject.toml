[project]
name = "anime-retrieval"
version = "0.1.0"
description = "Hybrid retrieval + reranker + MMR for the anime recommender"
authors = [{ name = "Zain Ul Abdin" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anime-core",
    "sentence-transformers>=3.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_retrieval"]

[project]
name = "anime-core"
version = "0.1.0"
description = "Shared schemas, clients, and protocols for the anime recommender"
authors = [{ name = "Zain Ul Abdin" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "openai>=1.50",
    "tenacity>=9.0",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "redis>=5",
    # Observability: tracing, metrics, structured logs + PII redaction
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "langfuse>=4.14.1,<5",
    "langchain>=0.3",
    # Async SQS client. In core because BOTH the API
    # (publishes jobs) and the worker (consumes them) use it.
    "aiobotocore>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_core"]

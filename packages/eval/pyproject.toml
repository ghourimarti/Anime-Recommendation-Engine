[project]
name = "anime-eval"
version = "0.1.0"
description = "Golden sets, RAGAS runners, and regression harness for the anime recommender"
authors = [{ name = "Zain Ul Abdin" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anime-core",
    "anime-retrieval",
]

# RAGAS is optional: it pulls heavy deps and needs an OpenAI key (LLM judge).
# Install with: uv sync --extra ragas
[project.optional-dependencies]
ragas = [
    "ragas>=0.2",
    "datasets>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_eval"]

# Ship the golden-set data files inside the wheel (importlib.resources reads them).
[tool.hatch.build.targets.wheel.force-include]
"src/anime_eval/golden_sets" = "anime_eval/golden_sets"

[project]
name = "anime-ingestion"
version = "0.1.0"
description = "Data loader, chunker, embedder, and indexer for the anime corpus"
authors = [{ name = "Zain Ul Abdin" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anime-core",
    "openai>=2.38.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_ingestion"]

[project]
name = "anime-worker"
version = "0.1.0"
description = "Async SQS workers — feedback, re-embed, housekeeping, GDPR"
authors = [{ name = "Zain Ul Abdin" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anime-core",
    # anime-ingestion gives the re-embed handler the existing ingest() pipeline.
    # Deliberately NO anime-retrieval → no sentence-transformers/torch → slim image.
    "anime-ingestion",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_worker"]

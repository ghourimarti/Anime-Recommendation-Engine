# #       - "packages/core/src/anime_core/embeddings/**"
# #       - "packages/ingestion/**"
# #       - "evals/**"
# #       - ".github/workflows/eval-gate.yml"
# #   push:
# #     branches: [main]
# #   schedule:
# #     # Weekly. Catches drift we didn't cause: a provider silently reweighting an
# #     # embedding model degrades retrieval with no commit of ours to blame.
# #     - cron: "0 6 * * 1"
# #   workflow_dispatch:


# name: Eval Gate

# # Retrieval quality is a build artifact. It gets a gate.
# #
# # This is the workflow whose absence let the reranker time out on every single
# # request for weeks: the advanced pipeline silently degraded to plain hybrid
# # order, the measured lift over naive retrieval fell to +0.000, and nothing
# # failed — because "did quality regress?" was only ever asked by a human running
# # `make eval` and reading a table.
# #
# # It is split from ci.yml because it needs a real OPENAI_API_KEY (embeddings) and
# # a live Postgres. Keeping it separate means ci.yml stays fast, keyless and
# # runnable on forks, while this one runs where the secrets exist.
# # on:
# #   pull_request:
# #     # Only for changes that can plausibly move the numbers. Running it on a README
# #     # edit just teaches people the gate is noise.
# #     paths:
# #       - "packages/retrieval/**"

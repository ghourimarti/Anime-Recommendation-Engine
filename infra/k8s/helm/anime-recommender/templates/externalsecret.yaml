{{- if .Values.externalSecrets.enabled }}
# External Secrets Operator: sync AWS Secrets Manager → one K8s
# Secret the pods envFrom. The real values live ONLY in AWS SM (set out-of-band
# by Terraform's secrets module + CLI); git never sees them.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.targetName }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.targetName }}
    creationPolicy: Owner
  data:
    {{- $prefix := .Values.externalSecrets.awsPrefix }}
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: "{{ $prefix }}/openai", property: value }
    - secretKey: GROQ_API_KEY
      remoteRef: { key: "{{ $prefix }}/groq", property: value }
    - secretKey: CLERK_SECRET_KEY
      remoteRef: { key: "{{ $prefix }}/clerk", property: value }
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef: { key: "{{ $prefix }}/langfuse", property: value }
    # DATABASE_URL / REDIS_URL are assembled into a secret in AWS SM by the
    # deploy step (from the Terraform RDS/Redis endpoints) and synced here.
    - secretKey: DATABASE_URL
      remoteRef: { key: "{{ $prefix }}/database-url", property: value }
    - secretKey: REDIS_URL
      remoteRef: { key: "{{ $prefix }}/redis-url", property: value }
{{- end }}

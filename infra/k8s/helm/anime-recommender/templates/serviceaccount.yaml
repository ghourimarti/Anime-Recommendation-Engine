# IRSA ServiceAccounts. The role-arn annotation is how a pod assumes
# its scoped IAM role (api = SQS send + secrets; worker = SQS consume + secrets).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.api.name }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.api.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.worker.name }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.worker.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}

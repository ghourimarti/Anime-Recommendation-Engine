# IRSA ServiceAccounts. The role-arn annotation is how a pod assumes
# its scoped IAM role (api = SQS send + secrets; worker = SQS consume + secrets).
#
# WHY THESE ARE pre-install/pre-upgrade HOOKS
# -------------------------------------------
# migrate-job.yaml is a pre-install hook at weight -5 and sets serviceAccountName.
# Helm creates hooks BEFORE the regular manifests, so a plain (non-hook)
# ServiceAccount does not exist yet when the Job's pod is admitted. The
# job-controller then refuses it with
#     pods "<release>-migrate-" is forbidden: error looking up service account
# and retries until Helm's --wait deadline expires, which surfaces as an
# unhelpful "Job in progress / context deadline exceeded".
#
# Found on a real cluster in P7.3. render-verify cannot catch this class of bug:
# it validates SCHEMAS, and every manifest here is schema-valid — the defect is
# in runtime ordering. That gap is exactly why Stage 2 exists.
#
# Weight -10 puts these strictly before the migrate Job (-5). ArgoCD gets the
# equivalent through PreSync plus sync-wave -10, ordering them ahead of the Job's
# own PreSync hook (which has no explicit wave, so it defaults to 0).
#
# before-hook-creation, NOT hook-succeeded: the SA must persist after the hook
# phase because the api/worker pods reference it at runtime. It is replaced
# rather than duplicated on upgrade.
#
# Trade-off accepted: hook resources are not tracked in the release manifest, so
# `helm uninstall` leaves these behind. Namespace deletion cleans them up, which
# is what down_local_k8s.sh --soft and any real teardown already do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.api.name }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    {{- with .Values.serviceAccount.api.roleArn }}
    eks.amazonaws.com/role-arn: {{ . }}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.worker.name }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    {{- with .Values.serviceAccount.worker.roleArn }}
    eks.amazonaws.com/role-arn: {{ . }}
    {{- end }}

{{- if .Values.migrate.enabled }}
# Migration Job as a Helm pre-install/pre-upgrade HOOK: runs
# `alembic upgrade head` to completion BEFORE the api Rollout proceeds. Same
# "release-phase, not runtime, not per-replica" principle as the compose migrate
# service — a 12-factor release step. (ArgoCD users also get a PreSync wave.)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "anime.name" . }}-migrate
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"          # before the workloads
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync     # equivalent under ArgoCD GitOps
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "anime.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.api.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: {{ include "anime.image" (dict "root" . "img" .Values.image.api) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: { name: {{ .Values.externalSecrets.targetName }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}

{{- if .Values.ingress.enabled }}
# Ingress: web at /, api at /v1/* (the BFF also proxies, but the api path is
# exposed for direct API clients). Controller-specific behaviour — TLS, scheme,
# target type — comes entirely from className + annotations, so the same
# template serves ALB (values-aws), ingress-nginx (values-doks), and is switched
# off on kind (values-local uses port-forward).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "anime.name" . }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "anime.name" . }}-api
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "anime.name" . }}-web
                port: { number: 80 }
{{- end }}

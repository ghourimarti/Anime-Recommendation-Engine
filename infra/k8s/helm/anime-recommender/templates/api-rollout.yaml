{{- if .Values.rollout.enabled }}
# api as an Argo Rollouts Rollout — the user-facing service gets a canary with
# an automated analysis gate + auto-rollback. (web/workers are plain
# Deployments: a bad worker doesn't face users, and KEDA+DLQ cover them.)
#
# The pod template is shared with api-deployment.yaml (anime.api.podTemplate).
# Canary steps come from .Values.api.canary.steps — they used to be hardcoded
# here as an identical inline copy, which made the values key dead config.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "anime.name" . }}-api
  namespace: {{ .Values.namespace }}
  labels: {{- include "anime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "anime.selectorLabels" . | nindent 6 }}
      component: api
  strategy:
    canary:
      steps:
        {{- range .Values.api.canary.steps }}
        {{- if .analysis }}
        # Automated gate: success-rate + p95 latency; abort + roll back on failure.
        - analysis:
            templates:
              - templateName: {{ include "anime.name" $ }}-api-success-rate
        {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
        {{- end }}
  template:
    {{- include "anime.api.podTemplate" . | nindent 4 }}
{{- end }}

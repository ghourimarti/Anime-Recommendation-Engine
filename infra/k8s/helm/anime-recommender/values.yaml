# Base values — VENDOR-NEUTRAL. Layered as (G3):
#
#   helm template anime . -f values.yaml -f values-<vendor>.yaml [-f values-<env>.yaml]
#
#   vendor = local | doks | aws    (what the CLUSTER can provide)
#   env    = dev | staging | prod  (how big, which hostnames, which prefixes)
#
# Nothing in this file may assume a particular cloud. It used to be the AWS
# profile under a "defaults" label — ECR registry, ALB ingress, IRSA, Secrets
# Manager, an SQS account URL — so every non-AWS overlay would have had to UNDO
# it. Vendor-specific settings now live only in values-<vendor>.yaml.
# Secrets are NEVER here.

namespace: anime

# Registry is the ONLY vendor variable in an image ref; repository names are
# identical everywhere. ghcr.io is the source of truth (P6.2) — the one registry
# kind, DOKS and EKS can all pull from.
image:
  registry: ghcr.io/ghourimarti
  pullPolicy: IfNotPresent
  # One tag for every component; CI sets it from the git tag. Empty falls back
  # to .Chart.AppVersion (G4: chart version == app version). Deliberately NOT
  # "latest": it makes "which build is running?" unanswerable and rollback
  # ambiguous. A per-component tag or digest overrides it.
  tag: ""
  # digest (sha256:...) wins over any tag — it is how "the same bytes in every
  # environment" is actually expressed.
  api: { repository: anime-recommender/api, tag: "", digest: "" }
  web: { repository: anime-recommender/web, tag: "", digest: "" }
  worker: { repository: anime-recommender/worker, tag: "", digest: "" }

serviceAccount:
  api:
    name: anime-api
    roleArn: "" # IRSA role ARN (EKS only) — from Terraform output api_irsa_role_arn
  worker:
    name: anime-worker
    roleArn: "" # IRSA role ARN (EKS only) — from Terraform output worker_irsa_role_arn

# External Secrets Operator. Off in the base: which secret backend exists is a
# property of the cluster, so each vendor overlay decides. When off, workloads
# still read a Secret named `targetName` — something else creates it.
externalSecrets:
  enabled: false
  secretStoreRef:
    name: "" # backend-specific; required when enabled (see values-aws.yaml)
    kind: ClusterSecretStore
  # Remote key prefix (AWS SM secret names anime-<env>/... on EKS).
  awsPrefix: anime-dev
  # The K8s Secret every workload envFroms — the vendor-neutral contract.
  targetName: anime-app-secrets
  refreshInterval: 1h

# Non-secret runtime config → ConfigMap.
config:
  logLevel: INFO
  otelExporterEndpoint: "" # e.g. http://otel-collector.observability:4317
  otelServiceName: anime-api
  otelSdkDisabled: "false"
  corsOrigins: '["https://anime.example.com"]'
  sqsQueuePrefix: anime-dev
  semanticCacheThreshold: "0.92"
  quotaFreeTierDaily: "20"

# Progressive delivery. Enabled: the api is an Argo Rollouts Rollout with the
# canary below and an automated analysis gate. Disabled: a plain Deployment.
# Both use ONE pod template (anime.api.podTemplate), so the toggle changes the
# delivery strategy and nothing else. The controller runs on any conformant
# cluster — this is not an AWS dependency.
rollout:
  enabled: true

api:
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Argo Rollouts canary steps: shift weight, pause, analyze, widen.
  # Rendered from here. They used to be dead config — the template hardcoded an
  # identical inline copy, so editing these changed nothing.
  # `analysis: true` expands to the AnalysisTemplate gate.
  canary:
    steps:
      - setWeight: 5
      - pause: { duration: 2m }
      - setWeight: 25
      - pause: { duration: 5m }
      - analysis: true # AnalysisTemplate gate before going to 100%
      - setWeight: 100
    analysis:
      successRateThreshold: "0.95"
      # p95 for /v1/recommend. A RAG request is genuinely seconds (retrieval +
      # rerank + LLM), so this is the SLO, not a round number. Gate latency as well
      # as errors: a bad canary can hold a perfect success rate while doubling
      # every response time, and success-rate alone waves that straight through.
      p95LatencySecondsThreshold: "3.0"
      # Must match OTEL_SERVICE_NAME — it becomes the `service_name` Prometheus
      # label via the collector's resource_to_telemetry_conversion.
      serviceName: anime-rag-api
      prometheusAddress: http://prometheus.observability:9090

web:
  replicas: 2
  port: 3000
  # Runtime config (Phase 6, R2): the web image carries neither value.
  # siteUrl = browser-facing origin; empty derives https://<ingress.host>.
  siteUrl: ""
  # Clerk publishable key: public by design (not a secret), set per environment.
  clerkPublishableKey: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# KEDA event-driven autoscaling for the workers. Disabled: each worker runs at a
# fixed floor of max(1, minReplicas) — scale-to-zero with no autoscaler would
# mean zero forever.
keda:
  enabled: true
  # Extra aws-sqs-queue trigger metadata. Authentication is backend-specific
  # (IRSA exists only on EKS), so the base carries none.
  triggerMetadata: {}

# One Deployment (+ KEDA ScaledObject when keda.enabled) per queue.
workers:
  feedback: { minReplicas: 1, maxReplicas: 20, queueLength: 10, activationQueueLength: 1 }
  ingestion: { minReplicas: 0, maxReplicas: 5, queueLength: 2, activationQueueLength: 1 }
  housekeeping: { minReplicas: 0, maxReplicas: 3, queueLength: 5, activationQueueLength: 1 }
workerResources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
awsRegion: us-east-1
# Base for the KEDA SQS queueURL: https://sqs.<region>.amazonaws.com/<accountId>.
# Required when keda.enabled. Full URL = "{base}/{config.sqsQueuePrefix}-{queue}".
sqsQueueUrlBase: ""

# alembic upgrade head as a pre-upgrade/pre-install hook (uses the api image).
migrate:
  enabled: true

# Controller behaviour (TLS, scheme, target type) lives entirely in className +
# annotations, so one template serves ALB and ingress-nginx.
ingress:
  enabled: true
  className: nginx
  host: anime.example.com
  annotations: {}

resourceQuota:
  enabled: true
  hardCpu: "8"
  hardMemory: 16Gi
  hardPods: "50"

networkPolicy:
  enabled: true
  # Who may reach pods from OUTSIDE the namespace (same-namespace traffic is
  # always allowed). A property of the ingress path, so it varies by controller:
  #   ingress-nginx    -> admit the controller's namespace
  #   AWS ALB, IP mode -> traffic comes from ALB ENIs in the VPC, not from any pod,
  #                       so a namespace rule never matches it: admit by CIDR
  ingressFrom:
    namespaces: [ingress-nginx]
    cidrs: []

[project]
name = "anime-recommender"
version = "0.1.0"
description = "Production-grade RAG SaaS for anime recommendation"
readme = "README.md"
authors = [{ name = "Zain Ul Abdin" }]
requires-python = ">=3.13,<3.14"
# torch is declared here only so the `tool.uv.sources` CPU-index pin below
# attaches — uv applies sources only to declared requirements, and torch is
# otherwise transitive via sentence-transformers. This routes torch to the CPU
# wheel for the whole workspace lock (no GPU; the reranker runs on CPU).
# torch is declared here (not just pulled transitively) so the [tool.uv.sources]
# pytorch-cpu index below actually applies to it — uv only honours a source for a
# requirement that is DECLARED.
#
# setuptools is declared for a different reason: it arrives transitively via torch,
# and torch does not care which version it gets. Left alone the resolver parked on
# 81.0.0, which carries PYSEC-2026-3447 (HIGH, fixed in 83.0.0), and the CI dependency
# audit blocks on HIGH. A transitive dep with a vulnerability and no direct declaration
# is unfixable from the outside — so we declare it and pin the floor.
dependencies = ["torch", "setuptools>=83.0.0"]

# ──────────────────────────────────────────────
# uv workspace
# ──────────────────────────────────────────────
[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/core",
    "packages/retrieval",
    "packages/ingestion",
    "packages/eval",
]

# Pin torch to PyTorch's CPU wheel index. torch is a TRANSITIVE dep (via
# sentence-transformers → anime-retrieval). On Linux the default PyPI torch wheel
# drags ~2GB of nvidia-* CUDA libraries; we have no GPU and the reranker runs on
# CPU, so those never execute. Pinning here makes uv.lock itself resolve the CPU
# build for every platform — `uv sync --frozen` in Docker then installs CPU torch
# reproducibly (UV_TORCH_BACKEND alone is ignored under --frozen: the lock wins).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only used for packages explicitly routed here (torch), not general resolution

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
anime-api = { workspace = true }
anime-worker = { workspace = true }
anime-core = { workspace = true }
anime-retrieval = { workspace = true }
anime-ingestion = { workspace = true }
anime-eval = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "alembic>=1.13",
    "pandas-stubs>=2.2",
    "httpx>=0.27",
    # Workspace members are installed in editable mode by `uv sync` automatically.
    # Listing them here makes the dev environment install them explicitly too.
    "anime-api",
    "anime-worker",
    "anime-core",
    "anime-retrieval",
    "anime-ingestion",
    "anime-eval",
]

# ──────────────────────────────────────────────
# Ruff (lint + format)
# ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps", "packages"]
extend-exclude = ["demo", ".venv", "Prompts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "SIM", # simplify
    "TID", # tidy imports
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/Path/etc. in argument defaults is the idiomatic pattern,
# not the B008 "mutable call in default" footgun. Whitelist them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ──────────────────────────────────────────────
# mypy (strict on src; tests excluded)
# ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
namespace_packages = true
explicit_package_bases = true
# Point mypy at the src/ roots only, not the package roots — otherwise mypy
# discovers each module twice (once as `packages.core.src.anime_core.*` via
# filesystem walk, once as `anime_core.*` via the uv-installed package).
mypy_path = [
    "apps/api/src",
    "apps/worker/src",
    "packages/core/src",
    "packages/retrieval/src",
    "packages/ingestion/src",
    "packages/eval/src",
]
files = [
    "apps/api/src",
    "apps/worker/src",
    "packages/core/src",
    "packages/retrieval/src",
    "packages/ingestion/src",
    "packages/eval/src",
]
exclude = [
    "demo/",
    "\\.venv/",
    "build/",
    "dist/",
    "tests/",
    "Prompts/",
]

# Third-party packages without type stubs.
# pgvector: no stubs as of v0.4.x.
# ragas / datasets: optional extra (not installed in the base env); lazy-imported
#   in anime_eval.ragas_runner behind a runtime guard.
[[tool.mypy.overrides]]
module = ["pgvector.*", "ragas.*", "datasets.*", "aiobotocore.*", "botocore.*"]
ignore_missing_imports = true

# ──────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["apps", "packages", "tests"]
python_files = "test_*.py"
python_functions = "test_*"
# Integration tests hit real services and are OPT-IN only (`uv run pytest -m integration`).
# Excluded by default so `make test` never spends API money or needs a live DB —
# necessary because create_app() calls load_dotenv(), which would otherwise populate
# DATABASE_URL/keys and silently un-skip them mid-run.
addopts = "-v --tb=short --strict-markers --import-mode=importlib -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (Postgres/OpenAI/Groq); opt-in via -m integration",
]
